<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden;

    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #stage { position: fixed; inset: 0; z-index: 1; }
  #stage canvas { display: block; width: 100% !important; height: 100% !important; }
  .title { position: fixed; top: 14px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 20; }
  .title h1 { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: 4px; text-shadow: 0 2px 10px rgba(10,60,110,.55); }
  .title p { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700; color: #0d4f84;
    background: rgba(255,255,255,.85); padding: 3px 12px; border-radius: 999px; box-shadow: 0 2px 8px rgba(10,60,110,.18); }
  .loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 30; transition: opacity .5s; }
  .loading.hide { opacity: 0; pointer-events: none; }
  .loading h2 { font-size: 20px; font-weight: 900; color: #fff; letter-spacing: 5px; text-shadow: 0 2px 10px rgba(10,60,110,.5); }
  .loading p { font-size: 13px; color: rgba(255,255,255,.85); }
  .err { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 32px; text-align: center; z-index: 31; color: #fff; }
  .err h3 { font-size: 18px; letter-spacing: 2px; }
  .err p { font-size: 13px; line-height: 1.8; color: rgba(255,255,255,.88); }
  .status { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 20;
    pointer-events: none; white-space: nowrap; font-size: 12px; font-weight: 700; color: #fff;
    background: rgba(10,60,110,.55); padding: 6px 16px; border-radius: 999px;
    box-shadow: 0 2px 8px rgba(10,60,110,.25); transition: opacity .5s; }
  .status.hide { opacity: 0; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .loading .bar { width: 190px; height: 4px; border-radius: 999px;
    background: rgba(255,255,255,.24); overflow: hidden; }
  .loading .bar i { display: block; width: 0%; height: 100%; background: #d8f4ff;
    border-radius: 999px; transition: width .25s; }
  .loading small { font-size: 11px; color: rgba(255,255,255,.72); letter-spacing: 1px; }

    故页面优先加载本地副本实现秒开;未携带 assets/ 时自动回退 CDN。

  按最终屏幕显示尺寸(模型仅约 40~60px)做过精简: 5.29MB -> 2.43MB (-54%):
    - tree 两张 1024x1024 RGB PNG -> 256x256 JPEG(第 3 张带 alpha,保持 PNG);
    - deer/rabbit 及 11 种新动物各删除未使用的 23~29 个动画剪辑

      几何未减面以保住轮廓。新增 11 个模型 10.68MB -> 2.89MB (-73%)。
    未精简的原始 GLB 备份于 logs_temp/glb_probe/before_opt/(该目录被 gitignore)。

  行走: deer/rabbit 自带骨骼 Walk 剪辑,用 SkeletonUtils.clone + 每实例
    AnimationMixer 播放真实步态。giraffe/panda 的 GLB 只有「1 节点 + 1 mesh、
    0 骨骼」,没有任何可动子节点 ⇒ 程序化补两套动作:
      ① gait 容器上的 AnimationClip(摇摆 / 点头 / 前后微摆;不动画
         scale 与高度,保证尺寸恒定、脚底不离地);
      ② 网格的两个 relative morph target,按局部高度 + 左右/前后分组,
         让对角腿交替前后摆动( Influence 与 gait clip 同一时钟驱动)。
    树固定不动。动物沿 (u,v) 参数空间步进,以 elevation >= LAND_MIN
    判定陆地,撞海岸或极区自动转向;动画速率与实际位移速度成正比,不滑步。

  贴地: 不再把模型统一抬到 SURF=R+0.012(那会浮起约 10% 身高)。
    改成按每个模型缩放后的半宽计算球面凹陷 sag = R - sqrt(R²-a²),
    下沉 sag*0.6 + 0.0015,让平底与球面切平;行走时不再叠加 bob 起伏。
